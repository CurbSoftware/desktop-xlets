<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Two stacked panel bars, the top one shorter, with a check mark
       overlapping the bottom-right. Integer coords, 1px-scale strokes,
       standard symbolic fill. -->
  <g fill="#bebebe">
    <rect x="1" y="2" width="9" height="3" rx="1"/>
    <rect x="1" y="7" width="12" height="3" rx="1"/>
  </g>
  <path d="M10 10.7 11.9 12.6 15.5 7.4"
        fill="none" stroke="#bebebe" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
